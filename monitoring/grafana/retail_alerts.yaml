apiVersion: 1
groups:
    - orgId: 1
      name: retail-api-alerts
      folder: Retail Monitoring
      interval: 30s
      rules:
        - uid: eg5h6modlvwn4e
          title: Retail API Down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: eg5gzhh299ts0b
              model:
                editorMode: code
                expr: up{job="retail-api"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: |-
                The Retail Sales Forecasting API is unreachable.
                Please check the FastAPI container and service logs.
            summary: Retail Forecasting API is down
          isPaused: false
          notification_settings:
            receiver: grafana-default-email
