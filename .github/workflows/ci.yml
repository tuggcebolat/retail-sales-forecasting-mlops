# Workflow'un adını belirliyoruz.
name: Retail Sales Forecasting CI

# Workflow'un ne zaman çalışacağını belirliyoruz.
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]
# GitHub Actions erişim izinlerini belirliyoruz.
permissions:
  contents: read
  packages: write

# Çalıştırılacak görevleri tanımlıyoruz.
jobs:
  test:
    # Görevimizi Linux ortamında çalıştırıyoruz.
    runs-on: ubuntu-latest

    steps:
      # Proje dosyalarını Runner ortamına aktarıyoruz.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python çalışma ortamını hazırlıyoruz.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Projenin ihtiyaç duyduğu kütüphaneleri kuruyoruz.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Unit ve integration testlerini çalıştırıyoruz.
      - name: Run tests
        run: python -m pytest tests/unit tests/integration -v

      # FastAPI Docker imajını oluşturuyoruz.
      - name: Build API image
        run: docker build -f api/Dockerfile -t retail-api:ci .

      # Streamlit Docker imajını oluşturuyoruz.
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t retail-frontend:ci .

      # Airflow Docker imajını oluşturuyoruz.
      - name: Build Airflow image
        run: docker build -f Dockerfile -t retail-airflow:ci .

      # GitHub Container Registry'ye giriş yapıyoruz.
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # API imajını etiketliyoruz.
      - name: Tag API image
        if: github.event_name == 'push'
        run: docker tag retail-api:ci ghcr.io/tuggcebolat/retail-api:latest

      # API imajını registry'ye gönderiyoruz.
      - name: Push API image
        if: github.event_name == 'push'
        run: docker push ghcr.io/tuggcebolat/retail-api:latest