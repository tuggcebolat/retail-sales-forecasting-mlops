services:

  # ==========================================
  # 1. POSTGRESQL - METADATA DATABASE
  # ==========================================
  postgres:
    # Use PostgreSQL as the Airflow metadata database.
    image: postgres:16

    container_name: retail_airflow_postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    # Persist database records.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Check whether PostgreSQL is ready.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ==========================================
  # 2. AIRFLOW INIT
  # ==========================================
  airflow-init:
    # Build and use our custom Docker image.
    build: .
    image: retail-airflow:latest

    container_name: retail_airflow_init

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # Wait until PostgreSQL is ready.
    depends_on:
      postgres:
        condition: service_healthy

    # Initialize the database and create an admin user.
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        (airflow users list | grep -q 'admin' ||
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin)

    restart: "no"


  # ==========================================
  # 3. AIRFLOW WEBSERVER
  # ==========================================
  airflow-webserver:
    # Use our custom Docker image.
    build: .
    image: retail-airflow:latest

    container_name: retail_airflow_webserver

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      # Allow Python to locate our project modules.
      PYTHONPATH: /opt/airflow

    # Expose the web interface locally.
    ports:
      - "127.0.0.1:8080:8080"

    # Share local directories with the container.
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command: webserver

    restart: unless-stopped


  # ==========================================
  # 4. AIRFLOW SCHEDULER
  # ==========================================
  airflow-scheduler:
    # Use our custom Docker image.
    build: .
    image: retail-airflow:latest

    container_name: retail_airflow_scheduler

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      PYTHONPATH: /opt/airflow

    # Mount project directories.
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    # Schedule and execute Airflow tasks.
    command: scheduler

    restart: unless-stopped
    
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: retail_mlflow
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    restart: unless-stopped


# ==========================================
# 5. PERSISTENT STORAGE
# ==========================================
volumes:
  postgres_data:
  mlflow_data: